version: 2

project_name: sail-worktree

builds:
  - main: .
    binary: sail-worktree
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w"]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - README_JA.md

checksum:
  name_template: checksums.txt

# Group the release notes under headings by the prefix of the commit subject (feat: fix: ...).
changelog:
  sort: asc
  use: git
  abbrev: -1 # do not show commit hashes
  format: "{{ .Message }}"
  groups:
    - title: "Features"
      regexp: '^feat(\([^)]*\))?!?:'
      order: 0
    - title: "Bug fixes"
      regexp: '^fix(\([^)]*\))?!?:'
      order: 1
    - title: "Refactoring and performance"
      regexp: '^(refactor|perf)(\([^)]*\))?!?:'
      order: 2
    - title: "Documentation"
      regexp: '^docs?(\([^)]*\))?!?:'
      order: 3
    - title: "CI and build"
      regexp: '^(ci|build|chore)(\([^)]*\))?!?:'
      order: 4
    - title: "Other"
      order: 99
  filters:
    exclude:
      - "^Merge "
      - "^test(\\([^)]*\\))?:"

release:
  footer: |

    ## Installation

    ```sh
    go install github.com/uehatsu-info/sail-worktree@{{ .Tag }}
    ```

    Or extract the attached archive that matches your OS and CPU and put `sail-worktree` somewhere on your PATH
    (`darwin` is macOS; the `windows` archives are zip files). You can verify the download with `checksums.txt`.

    ```sh
    sha256sum --check --ignore-missing checksums.txt   # on macOS: shasum -a 256 -c checksums.txt --ignore-missing
    ```
