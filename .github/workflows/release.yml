name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false # 依存が無く go.sum も無いので、キャッシュは使わない
      - name: テスト
        run: go test ./...
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 配布したバイナリが、タグどおりの版を表示することを確かめる。
  verify:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: linux/amd64 のバイナリで version を確かめる
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*_linux_amd64.tar.gz' --pattern 'checksums.txt'
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf ./*_linux_amd64.tar.gz
          got="$(./sail-worktree version)"
          echo "version: $got (tag: $TAG)"
          [ "$got" = "$TAG" ]
